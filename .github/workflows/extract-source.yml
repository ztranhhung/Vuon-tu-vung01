
name: Extract vocabulary website source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p /tmp/vuon-tu-vung
          unzip -o Vuon-Tu-Vung-Full-Source.zip -d /tmp/vuon-tu-vung
          cp -a /tmp/vuon-tu-vung/. .

      - name: Commit website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- Vuon-Tu-Vung-Full-Source.zip
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract Vườn Từ Vựng website source"
            git push
          fi
